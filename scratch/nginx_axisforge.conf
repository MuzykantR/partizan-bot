# ============ HTTP → 301 на HTTPS (кроме acme-challenge) ============
server {
    listen 80;
    listen [::]:80;
    server_name axisforge.tech www.axisforge.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/axisforge.tech;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============ Главный HTTPS-блок ============
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name axisforge.tech www.axisforge.tech;

    ssl_certificate     /etc/ssl/vpn/axisforge.tech.crt;
    ssl_certificate_key /etc/ssl/vpn/axisforge.tech.key;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    server_tokens off;

    root /var/www/axisforge.tech;
    index index.html;

    # ============ XHTTP VPN-inbound → Xray через gRPC (ПУБЛИЧНО, нужно для клиентов) ============
    location /2271b50cf51a5e3297f5fb406a5aa524 {
        grpc_pass grpc://127.0.0.1:8080;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;
        grpc_read_timeout 7d;
        grpc_send_timeout 7d;
        client_max_body_size 1G;
        client_body_buffer_size 4m;
    }

    # ============ Marzban subscription (ПУБЛИЧНО, нужно клиентам для получения конфига) ============
    location /274ba6b74d0c6820/ {
        proxy_pass http://127.0.0.1:8009;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============ PARTIZAN TWA Mini App Frontend ============
    location /twa/ {
        alias /var/www/axisforge.tech/twa/;
        try_files $uri $uri/ /twa/index.html;
    }

    # ============ PARTIZAN TWA Mini App Backend API ============
    location /twa-api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============ ПАНЕЛЬ, API, STATICS — УДАЛЕНЫ ИЗ NGINX ============
    # Доступ к панели Marzban — ТОЛЬКО через SSH-туннель:
    #   ssh -L 8000:127.0.0.1:8000 axisforge
    # Затем в браузере: http://localhost:8000/46f15e7c56954aaba82cc4d7eb17c40c/
    # См. RULE-502 в C:\customvpn\docs\ANTIDETECT_RULES.md

    # ============ Статический сайт-маскировка ============
    location / {
        try_files $uri $uri/ /404.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
